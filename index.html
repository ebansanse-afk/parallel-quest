    `;
  },

  exploreArea(areaId) {
    const pool = ENEMIES[areaId];
    if (!pool || pool.length === 0) return;

    // Weight enemies loosely around player's level in graveyard so low level can also start farming, while higher level meets stronger foes
    let candidates = pool;
    if (areaId === "graveyard") {
      const lv = this.state.lv;
      const filtered = pool.filter(e => e.lv <= lv + 8 && e.lv >= Math.max(1, lv - 12));
      if (filtered.length >= 3) candidates = filtered;
    }

    const template = candidates[Math.floor(Math.random() * candidates.length)];
    this.startBattle(template, areaId);
  },

  startSpecificBattle(bossId) {
    if (bossId === "demon_lord") {
      if (this.state.defeatedGenerals.length < 4) {
        this.openModal(`<div class="modal-title">🔒 封印された扉</div><p>四将を全員討伐するまで魔王の間へは入れません。</p><button class="btn" onclick="Game.closeModal()">閉じる</button>`);
        return;
      }
      this.startBattle(DEMON_LORD, "demon_lord");
      return;
    }
    const gen = FOUR_GENERALS.find(g => g.id === bossId);
    if (gen) {
      this.startBattle(gen, "four_generals");
    }
  },

  /* ========================================================================
     3. TURN-BASED COMBAT SYSTEM
     ======================================================================== */
  startBattle(enemyTemplate, areaId) {
    const stats = this.getComputedStats();
    const enemy = JSON.parse(JSON.stringify(enemyTemplate));
    enemy.maxHp = enemy.hp;
    enemy.statuses = {}; // burn, poison, freeze, para, curse
    enemy.buffs = { def: 0, atk: 0 };

    const pBuffs = {
      atk: stats.effects.startAtk || 0,
      def: stats.effects.startDef || 0,
      mag: stats.effects.startMag || 0,
      eva: 0,
      crit: 0
    };

    this.battle = {
      areaId,
      enemy,
      turn: 1,
      pStatuses: {},
      pBuffs,
      logs: [`${enemy.name}（Lv.${enemy.lv}）が現れた！`],
      finished: false,
      victory: false
    };

    if (pBuffs.atk > 0 || pBuffs.def > 0 || pBuffs.mag > 0) {
      this.battle.logs.push("ソウルの加護により戦闘開始時から能力が上昇している！");
    }

    this.render();
  },

  renderBattle(view) {
    const b = this.battle;
    const e = b.enemy;
    const stats = this.getComputedStats();
    const eHpPct = Math.max(0, Math.min(100, (e.hp / e.maxHp) * 100));

    const equippedSpellObjs = this.state.equippedSpells
      .map(id => this.getSpellById(id))
      .filter(Boolean);

    const statusTags = Object.keys(e.statuses).filter(k => e.statuses[k] > 0).map(k => {
      const names = { burn: "火傷", poison: "毒", freeze: "凍結", para: "麻痺", curse: "呪い" };
      return `<span class="badge" style="color:var(--accent-red); font-size:11px;">${names[k]}(${e.statuses[k]})</span>`;
    }).join(" ");

    const pStatusTags = Object.keys(b.pStatuses).filter(k => b.pStatuses[k] > 0).map(k => {
      const names = { burn: "火傷", poison: "毒", freeze: "凍結", para: "麻痺", curse: "呪い" };
      return `<span class="badge" style="color:var(--accent-red); font-size:11px;">${names[k]}(${b.pStatuses[k]})</span>`;
    }).join(" ");

    view.innerHTML = `
      <div class="enemy-box" id="enemy-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="badge">Turn ${b.turn}</span>
          <span style="font-size:12px; color:var(--text-muted);">Lv.${e.lv} / 回避${e.eva}%</span>
        </div>
        <div id="enemy-sprite" class="enemy-visual">${e.icon}</div>
        <div style="font-size:18px; font-weight:800; margin-bottom:6px;">${e.name}</div>
        <div style="margin-bottom:6px;">${statusTags}</div>
        <div class="stat-bar-wrap" style="max-width:300px; margin:0 auto;">
          <div class="stat-bar-fill enemy-hp-fill" style="width:${eHpPct}%;"></div>
          <div class="stat-bar-text"><span>ENEMY HP</span><span>${Math.max(0, e.hp)} / ${e.maxHp}</span></div>
        </div>
      </div>

      <div style="margin-bottom:6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
        <span style="font-size:12px; color:var(--text-muted);">状態:</span>
        ${pStatusTags || '<span style="font-size:12px; color:var(--accent-green);">正常</span>'}
        ${b.pBuffs.atk > 0 ? `<span class="badge" style="font-size:11px; color:var(--accent-gold);">攻+${Math.round(b.pBuffs.atk*100)}%</span>` : ""}
        ${b.pBuffs.def > 0 ? `<span class="badge" style="font-size:11px; color:var(--accent-blue);">防+${Math.round(b.pBuffs.def*100)}%</span>` : ""}
        ${b.pBuffs.mag > 0 ? `<span class="badge" style="font-size:11px; color:var(--accent-purple);">魔+${Math.round(b.pBuffs.mag*100)}%</span>` : ""}
      </div>

      <div class="battle-log" id="battle-log">
        ${b.logs.map(line => `<div>${line}</div>`).join("")}
      </div>

      ${b.finished ? `
        <button class="btn btn-gold" onclick="Game.finishBattleSequence()">戦闘結果を確認して進む</button>
      ` : `
        <div class="battle-actions" style="margin-bottom:10px;">
          <button class="btn btn-primary" onclick="Game.playerAttack()">⚔️ 通常攻撃</button>
          <button class="btn" onclick="Game.playerDefend()">🛡️ 防御・集中<br><span style="font-size:11px; font-weight:400;">被ダメ半減 & MP微回復</span></button>
        </div>

        <div class="card" style="padding:10px; margin-bottom:10px;">
          <div style="font-size:13px; font-weight:700; color:var(--accent-purple); margin-bottom:8px;">📖 装備中の魔法（最大8枠）</div>
          ${equippedSpellObjs.length === 0 ? '<div style="font-size:12px; color:var(--text-muted);">装備中の魔法がありません</div>' : `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
              ${equippedSpellObjs.map(sp => {
                const realMp = Math.max(0, Math.floor(sp.mp * (1 - stats.effects.mpCostRed)));
                const canCast = this.state.mp >= realMp;
                return `
                  <button class="btn btn-sm" style="flex-direction:column; align-items:flex-start; text-align:left; height:auto; padding:7px 9px;"
                    ${canCast ? "" : "disabled"} onclick="Game.playerCastSpell('${sp.id}')">
                    <div style="display:flex; justify-content:space-between; width:100%;">
                      <span style="font-size:13px;">${sp.name}</span>
                      <span class="attr-tag attr-${sp.attr}">${sp.attr}</span>
                    </div>
                    <span style="font-size:11px; color:var(--accent-blue); font-weight:400;">消費MP: ${realMp}</span>
                  </button>
                `;
              }).join("")}
            </div>
          `}
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <button class="btn btn-sm" onclick="Game.openBattleItemModal()">🎒 アイテム使用</button>
          <button class="btn btn-sm btn-danger" onclick="Game.fleeBattle(false)">🏃 逃走する</button>
        </div>
      `}
    `;

    const logBox = document.getElementById("battle-log");
    if (logBox) logBox.scrollTop = logBox.scrollHeight;
  },

  showEnemyPopup(text, color = "#ffffff") {
    const box = document.getElementById("enemy-box");
    const sprite = document.getElementById("enemy-sprite");
    if (sprite) {
      sprite.classList.remove("shake");
      void sprite.offsetWidth;
      sprite.classList.add("shake");
    }
    if (box) {
      const pop = document.createElement("div");
      pop.className = "floating-popup";
      pop.style.color = color;
      pop.textContent = text;
      box.appendChild(pop);
      setTimeout(() => pop.remove(), 900);
    }
  },

  checkPlayerActionBlocked() {
    const b = this.battle;
    if (b.pStatuses.freeze > 0) {
      b.logs.push("❄️ 体が凍りついて動けない！");
      return true;
    }
    if (b.pStatuses.para > 0 && Math.random() < 0.45) {
      b.logs.push("⚡ 体が痺れて動けない！");
      return true;
    }
    return false;
  },

  playerAttack() {
    if (!this.battle || this.battle.finished) return;
    const b = this.battle;
    const e = b.enemy;
    const stats = this.getComputedStats();

    if (!this.checkPlayerActionBlocked()) {
      // Enemy evasion check
      if (Math.random() * 100 < e.eva) {
        b.logs.push(`⚔️ 勇者の攻撃！しかし ${e.name} は素早く回避した！`);
        this.render();
        this.showEnemyPopup("回避！", "#4ea8de");
      } else {
        const effAtk = Math.floor(stats.atk * (1 + b.pBuffs.atk));
        const effDef = Math.floor(e.def * (1 + e.buffs.def));
        let dmg = Math.max(1, Math.floor(effAtk * 1.3 - effDef * 0.55));
        const isCrit = Math.random() * 100 < (stats.crit + b.pBuffs.crit);
        if (isCrit) {
          dmg = Math.floor(dmg * (1.65 + stats.effects.critDmg));
        }
        dmg += stats.effects.bonusDmg;
        e.hp -= dmg;

        let msg = `⚔️ 勇者の攻撃！${isCrit ? "【会心の一撃！】" : ""}${e.name} に ${dmg} のダメージ！`;
        if (stats.effects.lifesteal > 0) {
          const heal = Math.max(1, Math.floor(dmg * stats.effects.lifesteal));
          this.state.hp = Math.min(stats.maxHp, this.state.hp + heal);
          msg += ` (HP+${heal}吸収)`;
        }
        b.logs.push(msg);
        this.render();
        this.showEnemyPopup(isCrit ? `💥 ${dmg}!` : `${dmg}`, isCrit ? "#f0c45c" : "#ffffff");
      }
    }

    if (e.hp <= 0) {
      this.handleBattleVictory();
      return;
    }
    this.enemyTurn(false);
  },

  playerDefend() {
    if (!this.battle || this.battle.finished) return;
    const b = this.battle;
    const stats = this.getComputedStats();
    const mpRec = Math.max(3, Math.floor(stats.maxMp * 0.12));
    this.state.mp = Math.min(stats.maxMp, this.state.mp + mpRec);
    b.logs.push(`🛡️ 身を固めて防御態勢をとった！（MPが ${mpRec} 回復）`);
    this.updateTopBar();
    this.enemyTurn(true);
  },

  playerCastSpell(spellId) {
    if (!this.battle || this.battle.finished) return;
    const sp = this.getSpellById(spellId);
    const stats = this.getComputedStats();
    const realMp = Math.max(0, Math.floor(sp.mp * (1 - stats.effects.mpCostRed)));
    if (!sp || this.state.mp < realMp) return;

    const b = this.battle;
    const e = b.enemy;

    if (this.checkPlayerActionBlocked()) {
      this.enemyTurn(false);
      return;
    }

    this.state.mp -= realMp;
    const effMag = Math.floor(stats.mag * (1 + b.pBuffs.mag));
    let popupText = "";
    let popupColor = "#a76df2";

    if (sp.type === "heal" || sp.type === "heal_cure") {
      const healAmt = Math.floor(effMag * sp.power + this.state.lv * 6);
      this.state.hp = Math.min(stats.maxHp, this.state.hp + healAmt);
      let extra = "";
      if (sp.type === "heal_cure") {
        b.pStatuses = {};
        extra = " 状態異常もすべて浄化された！";
      }
      b.logs.push(`✨ 【${sp.name}】を唱えた！HPが ${healAmt} 回復した！${extra}`);
    } else if (sp.type === "mp_recover") {
      const rec = Math.floor(stats.maxMp * sp.val);
      this.state.mp = Math.min(stats.maxMp, this.state.mp + rec);
      b.logs.push(`💠 【${sp.name}】を唱えた！MPが ${rec} 回復した！`);
    } else if (sp.type === "buff_atk") {
      b.pBuffs.atk = Math.min(1.2, b.pBuffs.atk + sp.val);
      b.logs.push(`🔥 【${sp.name}】を唱えた！攻撃力が上昇した！`);
    } else if (sp.type === "buff_def") {
      b.pBuffs.def = Math.min(1.2, b.pBuffs.def + sp.val);
      b.logs.push(`🛡️ 【${sp.name}】を唱えた！防御力が上昇した！`);
    } else if (sp.type === "buff_mag") {
      b.pBuffs.mag = Math.min(1.2, b.pBuffs.mag + sp.val);
      b.logs.push(`🔮 【${sp.name}】を唱えた！魔力が上昇した！`);
    } else if (sp.type === "buff_eva") {
      b.pBuffs.eva = Math.min(30, b.pBuffs.eva + sp.val);
      if (sp.id === "m_thun_3") b.pBuffs.crit += 10;
      b.logs.push(`⚡ 【${sp.name}】を唱えた！回避率が上昇した！`);
    } else if (sp.type === "buff_all") {
      b.pBuffs.atk = Math.min(1.2, b.pBuffs.atk + sp.val);
      b.pBuffs.def = Math.min(1.2, b.pBuffs.def + sp.val);
      b.pBuffs.mag = Math.min(1.2, b.pBuffs.mag + sp.val);
      b.logs.push(`🌟 【${sp.name}】を唱えた！攻撃・防御・魔力が上昇した！`);
    } else if (sp.type === "debuff_both") {
      e.buffs.atk = Math.max(-0.5, e.buffs.atk - sp.val);
      e.buffs.def = Math.max(-0.5, e.buffs.def - sp.val);
      b.logs.push(`⛓️ 【${sp.name}】を唱えた！${e.name}の攻撃力と防御力が低下した！`);
    } else if (sp.type === "attack" || sp.type === "drain") {
      // Magical attack calculation
      const ignoreDef = sp.ignoreDef || 0;
      const effDef = Math.floor(e.def * (1 + e.buffs.def) * (1 - ignoreDef));
      let raw = effMag * sp.power * 1.45 - effDef * 0.35;

      // Soul magic & element boosts
      const elemBoost = stats.effects.elemBoost[sp.attr] || 0;
      raw *= (1 + stats.effects.magicBoost + elemBoost);

      // Enemy resistances
      const elemRes = (e.res && e.res[sp.attr]) || 0;
      const magRes = (e.res && e.res["魔法耐性"]) || 0;
      raw *= Math.max(0.25, 1 - elemRes - magRes);

      let dmg = Math.max(1, Math.floor(raw));
      const isCrit = Math.random() * 100 < (stats.crit + b.pBuffs.crit + (sp.critBonus || 0));
      if (isCrit) {
        dmg = Math.floor(dmg * (1.55 + stats.effects.critDmg));
      }
      e.hp -= dmg;

      let extraLog = "";
      if (elemRes > 0 || magRes > 0) extraLog += " (耐性軽減)";
      if (elemRes < 0) extraLog += " (弱点！)";

      if (sp.type === "drain") {
        const heal = Math.max(1, Math.floor(dmg * sp.drainRate));
        this.state.hp = Math.min(stats.maxHp, this.state.hp + heal);
        extraLog += ` HPを${heal}吸収！`;
      } else if (stats.effects.lifesteal > 0) {
        const heal = Math.max(1, Math.floor(dmg * stats.effects.lifesteal));
        this.state.hp = Math.min(stats.maxHp, this.state.hp + heal);
        extraLog += ` HP+${heal}吸収`;
      }

      if (sp.status && Math.random() < (sp.statusChance || 0.4)) {
        e.statuses[sp.status] = 3;
        const sNames = { burn: "火傷", poison: "毒", freeze: "凍結", para: "麻痺", curse: "呪い" };
        extraLog += ` 【${sNames[sp.status]}付与！】`;
      }
      if (sp.debuff === "atk") {
        e.buffs.atk = Math.max(-0.5, e.buffs.atk - sp.val);
        extraLog += ` 敵攻撃力低下！`;
      }
      if (sp.debuff === "def") {
        e.buffs.def = Math.max(-0.5, e.buffs.def - sp.val);
        extraLog += ` 敵防御力低下！`;
      }

      b.logs.push(`🔮 【${sp.name}】！${isCrit ? "【会心！】" : ""}${e.name} に ${dmg} の${sp.attr}ダメージ！${extraLog}`);
      popupText = `${dmg}`;
      popupColor = isCrit ? "#f0c45c" : "#d5b3ff";
    }

    this.updateTopBar();
    this.render();
    if (popupText) this.showEnemyPopup(popupText, popupColor);

    if (e.hp <= 0) {
      this.handleBattleVictory();
      return;
    }
    this.enemyTurn(false);
  },

  openBattleItemModal() {
    const usable = Object.entries(this.state.inventory)
      .filter(([, cnt]) => cnt > 0)
      .map(([id, cnt]) => ({ it: SHOP_ITEMS.find(x => x.id === id), cnt }))
      .filter(x => x.it);

    this.openModal(`
      <div class="modal-title">🎒 戦闘アイテム使用</div>
      ${usable.length === 0 ? '<p style="color:var(--text-muted);">使用できるアイテムがありません。</p>' :
        usable.map(({ it, cnt }) => `
          <div class="list-item">
            <div class="list-item-info">
              <div class="list-item-title">${it.name} <span class="badge">x${cnt}</span></div>
              <div class="list-item-sub">${it.desc}</div>
            </div>
            <button class="btn btn-sm btn-primary" onclick="Game.useBattleItem('${it.id}')">使用</button>
          </div>
        `).join("")}
      <button class="btn" style="margin-top:10px;" onclick="Game.closeModal()">閉じる</button>
    `);
  },

  useBattleItem(itemId) {
    this.closeModal();
    const cnt = this.state.inventory[itemId] || 0;
    if (cnt <= 0 || !this.battle) return;
    const it = SHOP_ITEMS.find(x => x.id === itemId);
    const stats = this.getComputedStats();
    const b = this.battle;
    const e = b.enemy;

    this.state.inventory[itemId] = cnt - 1;

    if (it.type === "heal_hp") {
      this.state.hp = Math.min(stats.maxHp, this.state.hp + it.val);
      b.logs.push(`🧪 ${it.name}を使用！HPが ${it.val} 回復した！`);
    } else if (it.type === "heal_hp_pct") {
      this.state.hp = stats.maxHp;
      b.logs.push(`🧪 ${it.name}を使用！HPが全回復した！`);
    } else if (it.type === "heal_mp") {
      this.state.mp = Math.min(stats.maxMp, this.state.mp + it.val);
      b.logs.push(`🧪 ${it.name}を使用！MPが ${it.val} 回復した！`);
    } else if (it.type === "cure_all") {
      this.state.hp = Math.min(stats.maxHp, this.state.hp + it.val);
      b.pStatuses = {};
      b.logs.push(`🧪 ${it.name}を使用！HP回復＆状態異常を全治療した！`);
    } else if (it.type === "battle_dmg") {
      e.hp -= it.val;
      b.logs.push(`💣 ${it.name}を投げつけた！${e.name} に ${it.val} の固定ダメージ！`);
    } else if (it.type === "battle_buff") {
      b.pBuffs.atk += it.val;
      b.pBuffs.mag += it.val;
      b.logs.push(`⚗️ ${it.name}を飲んだ！攻撃力と魔力が35%上昇した！`);
    }

    this.updateTopBar();
    if (e.hp <= 0) {
      this.handleBattleVictory();
      return;
    }
    this.enemyTurn(false);
  },

  enemyTurn(isDefending) {
    const b = this.battle;
    const e = b.enemy;
    const stats = this.getComputedStats();

    // Process enemy status DoTs
    for (const st of ["burn", "poison", "curse"]) {
      if (e.statuses[st] > 0) {
        const dot = Math.max(5, Math.floor(e.maxHp * 0.06));
        e.hp -= dot;
        e.statuses[st] -= 1;
        const names = { burn: "火傷", poison: "毒", curse: "呪い" };
        b.logs.push(`🔥 ${e.name}は${names[st]}により ${dot} のダメージを受けた！`);
      }
    }
    if (e.hp <= 0) {
      this.handleBattleVictory();
      return;
    }

    // Check enemy freeze/para
    let enemyActed = true;
    if (e.statuses.freeze > 0) {
      e.statuses.freeze -= 1;
      b.logs.push(`❄️ ${e.name}は凍結して動けない！`);
      enemyActed = false;
    } else if (e.statuses.para > 0) {
      e.statuses.para -= 1;
      if (Math.random() < 0.45) {
        b.logs.push(`⚡ ${e.name}は麻痺して動けない！`);
        enemyActed = false;
      }
    }

    if (enemyActed) {
      // Choose enemy action based on abilities
      const ab = e.abilities || [];
      const roll = Math.random();
      let action = "normal";
      if (ab.includes("heal_self") && e.hp < e.maxHp * 0.45 && roll < 0.35) action = "heal";
      else if (ab.includes("buff_def") && e.buffs.def < 0.4 && roll < 0.28) action = "buff";
      else if (ab.includes("debuff_player") && roll < 0.25) action = "debuff";
      else if (ab.includes("aoe_heavy") && roll < 0.32) action = "heavy";
      else if (ab.includes("double_strike") && roll < 0.35) action = "double";
      else if (ab.some(a => a.startsWith("elem_")) && roll < 0.45) action = "elem";
      else if (ab.some(a => a.startsWith("status_")) && roll < 0.35) action = "status";

      if (action === "heal") {
        const healAmt = Math.floor(e.maxHp * 0.16);
        e.hp = Math.min(e.maxHp, e.hp + healAmt);
        b.logs.push(`💚 ${e.name}は再生能力でHPを ${healAmt} 回復した！`);
      } else if (action === "buff") {
        e.buffs.def += 0.25;
        b.logs.push(`🛡️ ${e.name}は守りを固め、防御力が上昇した！`);
      } else if (action === "debuff") {
        b.pBuffs.atk = Math.max(-0.4, b.pBuffs.atk - 0.15);
        b.pBuffs.def = Math.max(-0.4, b.pBuffs.def - 0.15);
        b.logs.push(`📉 ${e.name}の威圧！勇者の攻撃力と防御力が低下した！`);
      } else {
        // Offensive action -> Check Player Evasion!
        const totalEva = Math.min(75, stats.eva + b.pBuffs.eva);
        const evaded = Math.random() * 100 < totalEva;

        if (evaded) {
          b.logs.push(`💨 ${e.name}の攻撃！勇者は見事に【回避！】した！`);
          this.showEnemyPopup("回避！", "#4cd180");

          // Counter on evasion soul effect
          if (stats.effects.counterOnEva) {
            const cDmg = Math.max(1, Math.floor(stats.atk * 1.1 * stats.effects.counterMult - e.def * 0.4));
            e.hp -= cDmg;
            b.logs.push(`⚡ ソウルの力でカウンター発動！${e.name} に ${cDmg} の反撃ダメージ！`);
            if (e.hp <= 0) {
              this.handleBattleVictory();
              return;
            }
          }
        } else {
          // Calculate incoming damage
          let effDef = Math.floor(stats.def * (1 + b.pBuffs.def));
          if (this.state.hp <= stats.maxHp * 0.5 && stats.effects.lowHpDef > 0) {
            effDef = Math.floor(effDef * (1 + stats.effects.lowHpDef));
          }
          const effEnemyAtk = Math.floor(e.atk * (1 + e.buffs.atk));
          let dmg = 0;

          if (action === "heavy") {
            dmg = Math.max(1, Math.floor(effEnemyAtk * 1.65 - effDef * 0.45));
            b.logs.push(`💥 ${e.name}の強大な全体衝撃波！`);
          } else if (action === "double") {
            dmg = Math.max(2, Math.floor((effEnemyAtk * 0.95 - effDef * 0.4) * 2));
            b.logs.push(`⚔️ ${e.name}の怒涛の連続攻撃！`);
          } else if (action === "elem") {
            const elemAb = ab.find(a => a.startsWith("elem_"));
            const attr = elemAb.split("_")[1];
            const res = stats.effects.elemRes[attr] || 0;
            dmg = Math.max(1, Math.floor((e.mag * 1.45 - effDef * 0.35) * (1 - res)));
            b.logs.push(`🔥 ${e.name}の${attr}属性攻撃！`);
          } else if (action === "status") {
            const stAb = ab.find(a => a.startsWith("status_"));
            const st = stAb.split("_")[1];
            dmg = Math.max(1, Math.floor(effEnemyAtk * 1.15 - effDef * 0.5));
            if (Math.random() >= stats.effects.statusRes) {
              b.pStatuses[st] = 3;
              const sNames = { burn: "火傷", poison: "毒", freeze: "凍結", para: "麻痺", curse: "呪い" };
              b.logs.push(`⚠️ ${e.name}の特殊攻撃！勇者は【${sNames[st]}】状態になった！`);
            } else {
              b.logs.push(`🛡️ ソウルの耐性で状態異常を防いだ！`);
            }
          } else {
            dmg = Math.max(1, Math.floor(effEnemyAtk * 1.25 - effDef * 0.5));
          }

          if (isDefending) dmg = Math.max(1, Math.floor(dmg * 0.5));
          this.state.hp = Math.max(0, this.state.hp - dmg);
          b.logs.push(`🩸 勇者は ${dmg} のダメージを受けた！`);
        }
      }
    }

    // Player end-of-turn status & regen
    for (const st of ["burn", "poison", "curse"]) {
      if (b.pStatuses[st] > 0) {
        const dot = Math.max(3, Math.floor(stats.maxHp * 0.05));
        this.state.hp = Math.max(0, this.state.hp - dot);
        b.pStatuses[st] -= 1;
        const names = { burn: "火傷", poison: "毒", curse: "呪い" };
        b.logs.push(`☠️ ${names[st]}のダメージでHPが ${dot} 減少した！`);
      }
    }

    if (this.state.hp > 0) {
      if (stats.effects.hpRegen > 0) {
        const hReg = Math.max(1, Math.floor(stats.maxHp * stats.effects.hpRegen));
        this.state.hp = Math.min(stats.maxHp, this.state.hp + hReg);
      }
      if (stats.effects.mpRegen > 0) {
        const mReg = Math.max(1, Math.floor(stats.maxMp * stats.effects.mpRegen));
        this.state.mp = Math.min(stats.maxMp, this.state.mp + mReg);
      }
    }

    this.updateTopBar();

    // Check player death -> Death Time Rewind!
    if (this.state.hp <= 0) {
      b.finished = true;
      b.victory = false;
      b.logs.push("💀 勇者は力尽きた……！");
      this.render();
      setTimeout(() => {
        this.triggerTimeRewind("death");
      }, 900);
      return;
    }

    b.turn += 1;
    this.render();
  },

  fleeBattle(forceMove = false, nextTab = "map") {
    this.closeModal();
    const b = this.battle;
    if (!b) return;
    if (!forceMove && Math.random() < 0.25 && b.areaId !== "demon_lord") {
      b.logs.push("🏃 逃走を試みたが回り込まれてしまった！");
      this.enemyTurn(false);
      return;
    }
    this.battle = null;
    this.addLog("battle", "戦闘から撤退した。（時間は1日経過）");
    const rewound = this.advanceDay(1);
    if (!rewound) {
      this.saveGame();
      this.switchTab(nextTab);
    }
  },

  handleBattleVictory() {
    const b = this.battle;
    const e = b.enemy;
    b.finished = true;
    b.victory = true;
    b.logs.push(`🎉 ${e.name} を討伐した！`);

    // Rewards
    const expGain = e.exp;
    const goldGain = e.gold;
    this.state.gold += goldGain;

    // Boss progress tracking
    if (b.areaId === "four_generals" && !this.state.defeatedGenerals.includes(e.id)) {
      this.state.defeatedGenerals.push(e.id);
      this.addLog("boss", `魔王軍四将【${e.name}】を撃破した！(${this.state.defeatedGenerals.length}/4)`);
    }
    if (b.areaId === "demon_lord") {
      this.state.demonLordDefeated = true;
      if (!this.state.gameCleared) {
        this.state.gameCleared = true;
        this.state.clearLevel = this.state.lv;
        this.state.clearLoop = this.state.loopCount;
      }
      this.addLog("boss", `【輪廻の魔王クロノヴァル】を討伐し、世界を救った！`);
    }

    // Soul Drop Check
    const droppedSouls = [];
    if (e.drops && Array.isArray(e.drops)) {
      for (const d of e.drops) {
        if (Math.random() < d.rate) {
          const soulObj = this.getSoulById(d.id);
          if (soulObj) {
            droppedSouls.push(soulObj);
            if (!this.state.ownedSouls.includes(soulObj.id)) {
              this.state.ownedSouls.push(soulObj.id);
              this.addLog("soul", `永続ソウル【${soulObj.name}】(${soulObj.rarity})を獲得した！`);
            } else {
              // Duplicate soul converts into bonus EXP & Gold so farming stays rewarding
              const bonusExp = 35;
              this.state.exp += bonusExp;
              this.addLog("soul", `既に所持している【${soulObj.name}】の魂片を吸収し、経験値+${bonusExp}を得た。`);
            }
          }
        }
      }
    }

    const { leveledUp, newlyLearned } = this.gainExp(expGain);
    const contextLearned = this.checkSpellUnlocks(b.areaId);
    const allNewSpells = [...newlyLearned, ...contextLearned];

    b.resultData = { expGain, goldGain, leveledUp, allNewSpells, droppedSouls };
    this.updateTopBar();
    this.render();
  },

  finishBattleSequence() {
    const b = this.battle;
    if (!b || !b.resultData) return;
    const { expGain, goldGain, leveledUp, allNewSpells, droppedSouls } = b.resultData;
    const wasDemonLord = b.areaId === "demon_lord";
    const enemyName = b.enemy.name;

    this.battle = null;
    this.addLog("battle", `${enemyName}に勝利！(EXP+${expGain}, +${goldGain}G)`);

    // Show Victory Summary Modal first
    let modalHtml = `
      <div class="modal-title">🏆 戦闘勝利！</div>
      <div class="status-grid" style="margin-bottom:12px;">
        <div class="status-item"><span class="status-label">獲得EXP</span><span class="status-val" style="color:var(--accent-blue);">+${expGain}</span></div>
        <div class="status-item"><span class="status-label">獲得ゴールド</span><span class="status-val" style="color:var(--accent-gold);">+${goldGain} G</span></div>
      </div>
    `;

    if (leveledUp > 0) {
      modalHtml += `<div class="card" style="border-color:var(--accent-green); padding:10px; text-align:center; font-weight:700; color:var(--accent-green);">🆙 レベルアップ！ Lv.${this.state.lv} になった！</div>`;
    }

    if (allNewSpells.length > 0) {
      modalHtml += `
        <div class="card" style="border-color:var(--accent-blue); padding:10px;">
          <div style="font-weight:700; color:var(--accent-blue); margin-bottom:4px;">📖 新たな魔法を習得！</div>
          ${allNewSpells.map(sp => `<div>・${sp.name}（${sp.attr} / 消費MP:${sp.mp}）</div>`).join("")}
        </div>
      `;
    }

    if (droppedSouls.length > 0) {
      modalHtml += droppedSouls.map(soul => `
        <div class="soul-drop-banner">
          <div style="font-size:12px; color:var(--accent-gold); font-weight:700;">✨ SOUL DROP!（時間巻き戻し後も永続維持）✨</div>
          <div class="r-${soul.rarity}" style="font-size:18px; font-weight:900; margin:4px 0;">💎 ${soul.name} [${soul.rarity}]</div>
          <div style="font-size:12px; color:var(--text-muted);">${this.formatSoulStats(soul)}</div>
          <div style="font-size:12px; color:var(--accent-purple); margin-top:4px;">特殊効果: ${soul.special}</div>
        </div>
      `).join("");
    }

    if (wasDemonLord) {
      modalHtml += `<button class="btn btn-gold" onclick="Game.closeModal(); Game.afterBattleDayAdvance(true);">👑 エンディングを見る</button>`;
    } else {
      modalHtml += `<button class="btn btn-primary" onclick="Game.closeModal(); Game.afterBattleDayAdvance(false);">次へ進む（1日経過）</button>`;
    }

    this.saveGame();
    this.switchTab("map");
    this.openModal(modalHtml);
  },

  afterBattleDayAdvance(showEnding) {
    if (showEnding) {
      this.saveGame();
      this.updateTopBar();
      this.showEndingModal();
      return;
    }
    const rewound = this.advanceDay(1);
    if (!rewound) {
      this.saveGame();
      this.updateTopBar();
      this.render();
    }
  },

  showEndingModal() {
    const lv = this.state.clearLevel || this.state.lv;
    const loop = this.state.clearLoop || this.state.loopCount;
    this.openModal(`
      <div class="ending-box">
        <div style="font-size:36px; margin-bottom:6px;">👑✨🌅</div>
        <div style="font-size:20px; font-weight:900; color:var(--accent-gold); margin-bottom:10px;">祝・魔王討伐達成！</div>
        <div class="status-grid" style="margin-bottom:10px;">
          <div class="status-item"><span class="status-label">総周回数</span><span class="status-val" style="color:var(--accent-purple);">${loop} 周目</span></div>
          <div class="status-item"><span class="status-label">クリア時レベル</span><span class="status-val" style="color:var(--accent-gold);">Lv.${lv}</span></div>
        </div>
        <div class="ending-text">${ENDING_EXACT_TEXT}</div>
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">
          クリア後もそのまま冒険を続け、ソウルの完全収集や高難度エリアの制覇を楽しめます！
        </p>
        <button class="btn btn-gold" onclick="Game.closeModal()">タップして閉じて冒険を続ける</button>
      </div>
    `);
  },

  /* ========================================================================
     4. MAGIC LIST, DETAIL & 8-SLOT EQUIPMENT SCREEN
     ======================================================================== */
  renderMagic(view) {
    const s = this.state;
    const attrs = ["all", "炎", "氷", "雷", "光", "闇", "無属性"];

    const learnedObjs = s.learnedSpells
      .map(id => this.getSpellById(id))
      .filter(Boolean)
      .filter(sp => this.magicFilter === "all" || sp.attr === this.magicFilter);

    view.innerHTML = `
      <div class="card">
        <div class="card-title">
          <span>🔮 戦闘用魔法編成（最大8枠）</span>
          <span style="font-size:12px; color:var(--text-muted);">${s.equippedSpells.filter(Boolean).length} / 8 装備中</span>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
          ${s.equippedSpells.map((spId, idx) => {
            const sp = this.getSpellById(spId);
            return `
              <div style="background:var(--bg-card); border:1px solid ${sp ? "var(--accent-blue)" : "var(--border-color)"}; border-radius:8px; padding:8px;">
                <div style="font-size:11px; color:var(--text-muted); display:flex; justify-content:space-between;">
                  <span>枠 ${idx + 1}</span>
                  ${sp ? `<span class="attr-tag attr-${sp.attr}">${sp.attr}</span>` : ""}
                </div>
                <div style="font-weight:700; font-size:13px; margin:4px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                  ${sp ? sp.name : "（空きスロット）"}
                </div>
                <div style="display:flex; gap:4px;">
                  <button class="btn btn-sm btn-primary" style="flex:1; min-height:30px; font-size:12px; padding:2px 6px;" onclick="Game.openSelectSpellForSlot(${idx})">セット</button>
                  ${sp ? `<button class="btn btn-sm btn-danger" style="min-height:30px; font-size:12px; padding:2px 8px;" onclick="Game.unequipSpellSlot(${idx})">解除</button>` : ""}
                </div>
              </div>
            `;
          }).join("")}
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>📖 習得済み魔法一覧</span>
          <span style="font-size:12px; color:var(--text-muted);">全${SPELLS.length}種中 ${s.learnedSpells.length}種習得</span>
        </div>
        <div class="tabs">
          ${attrs.map(a => `
            <button class="tab-btn ${this.magicFilter === a ? "active" : ""}" onclick="Game.magicFilter='${a}'; Game.render();">
              ${a === "all" ? "すべて" : a}
            </button>
          `).join("")}
        </div>
        ${learnedObjs.map(sp => {
          const isEquipped = s.equippedSpells.includes(sp.id);
          return `
            <div class="list-item" onclick="Game.openSpellDetailModal('${sp.id}')" style="cursor:pointer;">
              <div class="list-item-info">
                <div class="list-item-title">
                  <span class="attr-tag attr-${sp.attr}">${sp.attr}</span>
                  <span>${sp.name}</span>
                  ${isEquipped ? '<span class="badge" style="color:var(--accent-gold); font-size:11px;">装備中</span>' : ""}
                </div>
                <div class="list-item-sub">消費MP: ${sp.mp} / ${sp.desc}</div>
              </div>
              <span style="color:var(--text-muted); font-size:13px;">詳細 ›</span>
            </div>
          `;
        }).join("")}
      </div>
    `;
  },

  openSpellDetailModal(spellId) {
    const sp = this.getSpellById(spellId);
    if (!sp) return;
    const stats = this.getComputedStats();
    const estValue = sp.type === "heal" || sp.type === "heal_cure"
      ? `約 ${Math.floor(stats.mag * sp.power + this.state.lv * 6)} 回復`
      : sp.power > 0
        ? `約 ${Math.floor(stats.mag * sp.power * 1.45)} 基準威力 (倍率 ${sp.power}x)`
        : "補助・強化魔法";

    const sNames = { burn: "火傷付与", poison: "毒付与", freeze: "凍結(行動不能)", para: "麻痺付与", curse: "呪い付与" };
    const extraEffect = sp.status ? `${sNames[sp.status]} (確率${Math.round(sp.statusChance * 100)}%)`
      : sp.debuff ? `敵能力低下 (${Math.round(sp.val * 100)}%)`
      : sp.type === "drain" ? `与ダメージの${Math.round(sp.drainRate * 100)}%HP吸収`
      : sp.type === "heal_cure" ? "状態異常を全治療"
      : "なし";

    const specialEffect = sp.critBonus ? `会心率+${sp.critBonus}%`
      : sp.ignoreDef ? `敵防御力${Math.round(sp.ignoreDef * 100)}%無視`
      : sp.type.startsWith("buff") ? "戦闘中ステータス強化"
      : sp.type === "mp_recover" ? `最大MPの${Math.round(sp.val * 100)}%回復`
      : "なし";

    const equippedSlot = this.state.equippedSpells.indexOf(sp.id);

    this.openModal(`
      <div class="modal-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span>📖 ${sp.name}</span>
        <span class="attr-tag attr-${sp.attr}">${sp.attr}</span>
      </div>
      <div class="status-grid" style="margin-bottom:12px;">
        <div class="status-item"><span class="status-label">属性</span><span class="status-val">${sp.attr}</span></div>
        <div class="status-item"><span class="status-label">消費MP</span><span class="status-val" style="color:var(--accent-blue);">${sp.mp}</span></div>
        <div class="status-item" style="grid-column:span 2;"><span class="status-label">ダメージ/回復量</span><span class="status-val">${estValue}</span></div>
        <div class="status-item" style="grid-column:span 2;"><span class="status-label">追加効果</span><span class="status-val">${extraEffect}</span></div>
        <div class="status-item" style="grid-column:span 2;"><span class="status-label">特殊効果</span><span class="status-val">${specialEffect}</span></div>
      </div>
      <p style="font-size:13px; color:var(--text-muted);">${sp.desc}</p>
      <div style="display:flex; gap:8px; margin-top:14px;">
        ${equippedSlot !== -1
          ? `<button class="btn btn-danger" onclick="Game.unequipSpellSlot(${equippedSlot}); Game.closeModal();">枠${equippedSlot + 1}から解除</button>`
          : `<button class="btn btn-primary" onclick="Game.autoEquipSpell('${sp.id}'); Game.closeModal();">空き枠に装備する</button>`}
        <button class="btn" onclick="Game.closeModal()">閉じる</button>
      </div>
    `);
  },

  openSelectSpellForSlot(slotIdx) {
    const s = this.state;
    const available = s.learnedSpells
      .map(id => this.getSpellById(id))
      .filter(Boolean);

    this.openModal(`
      <div class="modal-title">枠 ${slotIdx + 1} にセットする魔法を選択</div>
      <p style="font-size:12px; color:var(--text-muted); margin-top:0;">※同じ魔法を複数枠に装備することはできません。</p>
      ${available.map(sp => {
        const usedIdx = s.equippedSpells.indexOf(sp.id);
        const alreadyEquippedElsewhere = usedIdx !== -1 && usedIdx !== slotIdx;
        return `
          <div class="list-item">
            <div class="list-item-info">
              <div class="list-item-title">
                <span class="attr-tag attr-${sp.attr}">${sp.attr}</span>
                <span>${sp.name}</span>
              </div>
              <div class="list-item-sub">消費MP:${sp.mp} / ${sp.desc}</div>
            </div>
            ${alreadyEquippedElsewhere
              ? `<span class="badge" style="color:var(--text-muted);">枠${usedIdx + 1}装備中</span>`
              : `<button class="btn btn-sm btn-primary" onclick="Game.equipSpellToSlot(${slotIdx}, '${sp.id}')">選択</button>`}
          </div>
        `;
      }).join("")}
      <button class="btn" style="margin-top:10px;" onclick="Game.closeModal()">キャンセル</button>
    `);
  },

  equipSpellToSlot(slotIdx, spellId) {
    // Prevent duplicate equipping
    if (this.state.equippedSpells.includes(spellId) && this.state.equippedSpells[slotIdx] !== spellId) {
      return;
    }
    this.state.equippedSpells[slotIdx] = spellId;
    this.saveGame();
    this.closeModal();
    this.render();
  },

  autoEquipSpell(spellId) {
    if (this.state.equippedSpells.includes(spellId)) return;
    const emptyIdx = this.state.equippedSpells.indexOf(null);
    if (emptyIdx === -1) {
      this.openModal(`<div class="modal-title">⚠️ 装備枠がいっぱいです</div><p>最大8枠すべてに魔法が装備されています。いずれかの枠を解除してから装備してください。</p><button class="btn" onclick="Game.closeModal()">閉じる</button>`);
      return;
    }
    this.state.equippedSpells[emptyIdx] = spellId;
    this.saveGame();
    this.render();
  },

  unequipSpellSlot(slotIdx) {
    this.state.equippedSpells[slotIdx] = null;
    this.saveGame();
    this.render();
  },

  /* ========================================================================
     5. SOUL EQUIPMENT & DETAIL SCREEN (Permanent Across Loops)
     ======================================================================== */
  formatSoulStats(soul) {
    const parts = [];
    if (soul.atk) parts.push(`攻撃+${soul.atk}`);
    if (soul.def) parts.push(`防御+${soul.def}`);
    if (soul.mag) parts.push(`魔力+${soul.mag}`);
    if (soul.hp) parts.push(`HP+${soul.hp}`);
    if (soul.mp) parts.push(`MP+${soul.mp}`);
    if (soul.crit) parts.push(`会心+${soul.crit}%`);
    if (soul.eva) parts.push(`回避+${soul.eva}%`);
    return parts.length > 0 ? parts.join(" / ") : "特殊効果特化";
  },

  isSoulEquipped(soulId) {
    const eq = this.state.equippedSouls;
    return eq.weapon === soulId || eq.armor === soulId || eq.acc1 === soulId || eq.acc2 === soulId;
  },

  renderSoul(view) {
    const s = this.state;
    const eq = s.equippedSouls;
    const slots = [
      { key: "weapon", label: "武器ソウル", soul: this.getSoulById(eq.weapon) },
      { key: "armor", label: "防具ソウル", soul: this.getSoulById(eq.armor) },
      { key: "acc1", label: "装飾ソウル 1", soul: this.getSoulById(eq.acc1) },
      { key: "acc2", label: "装飾ソウル 2", soul: this.getSoulById(eq.acc2) }
    ];

    const ownedObjs = s.ownedSouls
      .map(id => this.getSoulById(id))
      .filter(Boolean)
      .filter(soul => this.soulFilter === "all" || soul.slot === this.soulFilter);

    view.innerHTML = `
      <div class="card">
        <div class="card-title">
          <span>💎 装備中のソウル（時間巻き戻し不滅）</span>
          <span style="font-size:12px; color:var(--accent-purple);">収集率: ${s.ownedSouls.length}/${SOULS.length}</span>
        </div>
        ${slots.map(sl => `
          <div class="list-item ${sl.soul ? `border-${sl.soul.rarity}` : ""}">
            <div class="list-item-info">
              <div style="font-size:11px; color:var(--text-muted);">${sl.label}</div>
              ${sl.soul ? `
                <div class="list-item-title r-${sl.soul.rarity}">${sl.soul.name} [${sl.soul.rarity}]</div>
                <div class="list-item-sub">${this.formatSoulStats(sl.soul)} ｜ ${sl.soul.special}</div>
              ` : `<div style="font-size:13px; color:var(--text-muted);">（未装備）</div>`}
            </div>
            ${sl.soul ? `<button class="btn btn-sm btn-danger" onclick="Game.unequipSoul('${sl.key}')">解除</button>` : ""}
          </div>
        `).join("")}
      </div>

      <div class="card">
        <div class="card-title">
          <span>🔮 所持ソウル一覧（タップで詳細・比較）</span>
        </div>
        <div class="tabs">
          <button class="tab-btn ${this.soulFilter === "all" ? "active" : ""}" onclick="Game.soulFilter='all'; Game.render();">すべて</button>
          <button class="tab-btn ${this.soulFilter === "weapon" ? "active" : ""}" onclick="Game.soulFilter='weapon'; Game.render();">武器</button>
          <button class="tab-btn ${this.soulFilter === "armor" ? "active" : ""}" onclick="Game.soulFilter='armor'; Game.render();">防具</button>
          <button class="tab-btn ${this.soulFilter === "acc" ? "active" : ""}" onclick="Game.soulFilter='acc'; Game.render();">装飾</button>
        </div>

        ${ownedObjs.length === 0 ? '<div style="color:var(--text-muted); font-size:13px;">該当するソウルを所持していません。「鎧の墓場」で強敵を倒すと獲得できます。</div>' :
          ownedObjs.map(soul => {
            const equipped = this.isSoulEquipped(soul.id);
            const slotNames = { weapon: "武器", armor: "防具", acc: "装飾" };
            return `
              <div class="list-item border-${soul.rarity}" onclick="Game.openSoulDetailModal('${soul.id}')" style="cursor:pointer;">
                <div class="list-item-info">
                  <div class="list-item-title">
                    <span class="badge" style="font-size:11px;">${slotNames[soul.slot]}</span>
                    <span class="r-${soul.rarity}">${soul.name}</span>
                    <span class="r-${soul.rarity}" style="font-size:12px;">[${soul.rarity}]</span>
                    ${equipped ? '<span class="badge" style="color:var(--accent-gold); font-size:11px;">装備中</span>' : ""}
                  </div>
                  <div class="list-item-sub">${this.formatSoulStats(soul)}</div>
                  <div class="list-item-sub" style="color:var(--accent-purple);">特殊効果: ${soul.special}</div>
                </div>
                <span style="color:var(--text-muted); font-size:13px;">詳細 ›</span>
              </div>
            `;
          }).join("")}
      </div>
    `;
  },

  openSoulDetailModal(soulId) {
    const soul = this.getSoulById(soulId);
    if (!soul) return;
    const eq = this.state.equippedSouls;
    const curStats = this.getComputedStats();

    // Preview stat changes if equipped
    const previewEq = Object.assign({}, eq);
    if (soul.slot === "weapon") previewEq.weapon = soul.id;
    else if (soul.slot === "armor") previewEq.armor = soul.id;
    else if (soul.slot === "acc") {
      if (eq.acc1 === soul.id || eq.acc2 === soul.id) {
        // already equipped
      } else if (!eq.acc1) previewEq.acc1 = soul.id;
      else if (!eq.acc2) previewEq.acc2 = soul.id;
      else previewEq.acc1 = soul.id;
    }
    const nextStats = this.getComputedStats(previewEq);

    const diffStr = (a, b, suffix = "") => {
      const d = b - a;
      if (d === 0) return `${b}${suffix}`;
      return d > 0
        ? `${b}${suffix} <span style="color:var(--accent-green);">(+${d}${suffix})</span>`
        : `${b}${suffix} <span style="color:var(--accent-red);">(${d}${suffix})</span>`;
    };

    const alreadyEquipped = this.isSoulEquipped(soul.id);

    let actionButtons = "";
    if (alreadyEquipped) {
      actionButtons = `<button class="btn btn-danger" onclick="Game.unequipSoulById('${soul.id}'); Game.closeModal();">装備を解除する</button>`;
    } else if (soul.slot === "weapon") {
      actionButtons = `<button class="btn btn-gold" onclick="Game.equipSoul('weapon', '${soul.id}'); Game.closeModal();">武器枠に装備する</button>`;
    } else if (soul.slot === "armor") {
      actionButtons = `<button class="btn btn-gold" onclick="Game.equipSoul('armor', '${soul.id}'); Game.closeModal();">防具枠に装備する</button>`;
    } else if (soul.slot === "acc") {
      actionButtons = `
        <button class="btn btn-gold" onclick="Game.equipSoul('acc1', '${soul.id}'); Game.closeModal();">装飾枠1に装備</button>
        <button class="btn btn-gold" onclick="Game.equipSoul('acc2', '${soul.id}'); Game.closeModal();">装飾枠2に装備</button>
      `;
    }

    this.openModal(`
      <div class="modal-title r-${soul.rarity}">💎 ${soul.name} [${soul.rarity}]</div>
      <div style="font-size:13px; margin-bottom:8px;">
        <strong>基本性能:</strong> ${this.formatSoulStats(soul)}
      </div>
      <div style="font-size:13px; color:var(--accent-purple); margin-bottom:12px;">
        <strong>特殊効果:</strong> ${soul.special}
      </div>
      <div class="card" style="background:#0d1017; padding:10px; font-size:13px;">
        <div style="font-weight:700; margin-bottom:6px; color:var(--text-muted);">装備時のステータス変化プレビュー</div>
        <div class="status-grid">
          <div>HP: ${diffStr(curStats.maxHp, nextStats.maxHp)}</div>
          <div>MP: ${diffStr(curStats.maxMp, nextStats.maxMp)}</div>
          <div>攻撃: ${diffStr(curStats.atk, nextStats.atk)}</div>
          <div>防御: ${diffStr(curStats.def, nextStats.def)}</div>
          <div>魔力: ${diffStr(curStats.mag, nextStats.mag)}</div>
          <div>回避: ${diffStr(curStats.eva, nextStats.eva, "%")}</div>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">
        ${actionButtons}
        <button class="btn" onclick="Game.closeModal()">閉じる</button>
      </div>
    `);
  },

  equipSoul(slotKey, soulId) {
    // Prevent equipping the exact same soul in multiple slots
    if (this.isSoulEquipped(soulId)) {
      this.unequipSoulById(soulId);
    }
    this.state.equippedSouls[slotKey] = soulId;
    const stats = this.getComputedStats();
    this.state.hp = Math.min(stats.maxHp, this.state.hp);
    this.state.mp = Math.min(stats.maxMp, this.state.mp);
    this.saveGame();
    this.updateTopBar();
    this.render();
  },

  unequipSoul(slotKey) {
    this.state.equippedSouls[slotKey] = null;
    const stats = this.getComputedStats();
    this.state.hp = Math.min(stats.maxHp, this.state.hp);
    this.state.mp = Math.min(stats.maxMp, this.state.mp);
    this.saveGame();
    this.updateTopBar();
    this.render();
  },

  unequipSoulById(soulId) {
    const eq = this.state.equippedSouls;
    for (const k of ["weapon", "armor", "acc1", "acc2"]) {
      if (eq[k] === soulId) eq[k] = null;
    }
    const stats = this.getComputedStats();
    this.state.hp = Math.min(stats.maxHp, this.state.hp);
    this.state.mp = Math.min(stats.maxMp, this.state.mp);
    this.saveGame();
    this.updateTopBar();
    this.render();
  },

  /* ========================================================================
     6. LOGS & SAVE/LOAD MANAGEMENT SCREEN
     ======================================================================== */
  renderLog(view) {
    const s = this.state;
    view.innerHTML = `
      <div class="card">
        <div class="card-title">💾 セーブ・データ管理</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">
          <button class="btn btn-primary" onclick="Game.saveGame(); Game.openModal('<div class=\'modal-title\'>💾 セーブ完了</div><p>進行状況をブラウザに保存しました。</p><button class=\'btn\' onclick=\'Game.closeModal()\'>閉じる</button>');">手動セーブ</button>
          <button class="btn" onclick="Game.returnToTitle()">タイトル画面へ</button>
        </div>
        ${s.gameCleared ? `<button class="btn btn-gold" style="margin-bottom:8px;" onclick="Game.showEndingModal()">👑 クリア結果・エンディング再表示</button>` : ""}
        <button class="btn btn-danger btn-sm" style="width:100%;" onclick="Game.confirmHardReset()">セーブデータを完全初期化</button>
      </div>

      <div class="card">
        <div class="card-title">
          <span>📜 冒険の記録ログ</span>
          <span style="font-size:12px; color:var(--text-muted);">最新${s.logs.length}件</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px; font-size:13px;">
          ${s.logs.map(l => {
            let color = "var(--text-main)";
            if (l.type === "rewind_death") color = "var(--accent-red)";
            else if (l.type === "rewind_time") color = "var(--accent-purple)";
            else if (l.type === "soul") color = "var(--accent-gold)";
            else if (l.type === "magic") color = "var(--accent-blue)";
            else if (l.type === "boss") color = "var(--accent-green)";
            return `<div style="padding:6px 8px; background:var(--bg-card); border-radius:6px; color:${color};">${l.text}</div>`;
          }).join("")}
        </div>
      </div>
    `;
  },

  returnToTitle() {
    this.saveGame();
    document.getElementById("game-shell").style.display = "none";
    document.getElementById("title-screen").style.display = "flex";
    this.init();
  },

  openModal(html) {
    const backdrop = document.getElementById("modal-backdrop");
    const content = document.getElementById("modal-content");
    content.innerHTML = html;
    backdrop.classList.add("open");
  },

  closeModal() {
    document.getElementById("modal-backdrop").classList.remove("open");
  }
};

window.addEventListener("DOMContentLoaded", () => {
  Game.init();
});
</script>
</body>
</html>
